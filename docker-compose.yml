services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: flow_titration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./storage/uploads:/app/storage/uploads

volumes:
  postgres-data:
