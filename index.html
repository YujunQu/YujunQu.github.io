  <meta
    name="description"
    content="基于 Flow titration data.xlsx 构建的流式滴定数据查询页面，支持按反应物种、染料和关键词筛选，并查看滴定结果图片。"
  />
  <link rel="stylesheet" href="/style.css?v=20260822-1" />
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div>
        <p class="page-kicker">Flow Cytometry Titration</p>
        <h1>流式滴定数据查询</h1>
      </div>
      <div class="page-header-side">
        <span class="result-badge">
          <strong id="resultCount">43</strong>
          <span>条命中</span>
        </span>
      </div>
    </header>

    <main class="catalog-shell">
      <aside class="filters-panel">
        <div class="panel-header">
          <div>
            <p class="panel-kicker">Filter Directory</p>
            <h2>筛选条件</h2>
          </div>
          <button type="button" class="clear-button" id="clearFilters">
            Clear All
          </button>
        </div>

        <div class="search-card">
          <label class="search-label" for="searchInput">关键词检索</label>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="输入靶点、产品名、货号、克隆号或厂家"
            autocomplete="off"
          />
        </div>

        <section class="filter-group">
          <div class="filter-heading">
            <h3>反应物种</h3>
            <span id="speciesFilterCount" class="filter-count"></span>
          </div>
          <div id="speciesFilters" class="filter-options"></div>
        </section>

        <section class="filter-group">
          <div class="filter-heading">
            <h3>染料</h3>
            <span id="dyeFilterCount" class="filter-count"></span>
          </div>
          <div id="dyeFilters" class="filter-options"></div>
        </section>
      </aside>

      <section class="results-panel">
        <div class="results-toolbar">
          <div>
            <p class="panel-kicker">Search Results</p>
            <h2 id="resultsHeading">全部记录</h2>
          </div>
          <p class="results-subtitle">关键词、物种和染料筛选会实时联动结果与左侧选项。</p>
        </div>

        <div id="activeFilters" class="active-filters" hidden></div>
        <div id="resultsList" class="results-list"></div>

        <div id="emptyState" class="empty-state" hidden>
          <p class="empty-title">没有找到匹配记录</p>
          <p class="empty-text">请调整筛选条件或清空关键词后再试。</p>
        </div>
      </section>
    </main>
  </div>

  <div id="imageModal" class="image-modal" hidden>
    <div class="image-modal-backdrop" data-close="true"></div>
    <div class="image-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="imageModalTitle">
      <button type="button" class="image-modal-close" id="closeImageModal" aria-label="关闭滴定结果预览">
        ×
      </button>
      <figure class="image-modal-figure">
        <img id="modalImage" src="" alt="" />
        <figcaption id="imageModalTitle"></figcaption>
      </figure>
    </div>
  </div>

    const state = {
      search: "",
      species: "",
      dye: "",
      previewOpen: false,
      previewImage: "",
      previewTitle: ""
    };

    const customSpeciesOrder = ["Human", "Mouse", "pig"];
    const filterLabels = {
      species: "反应物种",
      dye: "染料"
    };

    const searchInput = document.getElementById("searchInput");
    const clearFiltersButton = document.getElementById("clearFilters");
    const resultCount = document.getElementById("resultCount");
    const resultsHeading = document.getElementById("resultsHeading");
    const speciesFilters = document.getElementById("speciesFilters");
    const dyeFilters = document.getElementById("dyeFilters");
    const speciesFilterCount = document.getElementById("speciesFilterCount");
    const dyeFilterCount = document.getElementById("dyeFilterCount");
    const activeFilters = document.getElementById("activeFilters");
    const resultsList = document.getElementById("resultsList");
    const emptyState = document.getElementById("emptyState");
    const imageModal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const imageModalTitle = document.getElementById("imageModalTitle");
    const closeImageModal = document.getElementById("closeImageModal");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function isMissing(value) {
      if (value === null || value === undefined) {
        return true;
      }
      const normalized = String(value).trim();
      return normalized === "" || normalized === "\\" || normalized === "/" || normalized === "未知";
    }

    function displayValue(value, fallback = "待补充") {
      return isMissing(value) ? fallback : value;
    }

    function normalizeVendor(value) {
      if (String(value).toLowerCase() === "selleck") {
        return "Selleck";
      }
      return value;
    }

    const data = rawData.map((item, index) => ({
      ...item,
      id: `row-${index + 1}`,
      vendor: normalizeVendor(item.vendor),
      imagePath: imageFiles[index] || ""
    }));

    function compareOptions(key, left, right) {
      if (key === "species") {
        const leftIndex = customSpeciesOrder.indexOf(left);
        const rightIndex = customSpeciesOrder.indexOf(right);
        const safeLeft = leftIndex === -1 ? Number.MAX_SAFE_INTEGER : leftIndex;
        const safeRight = rightIndex === -1 ? Number.MAX_SAFE_INTEGER : rightIndex;
        return safeLeft - safeRight || left.localeCompare(right, "zh-CN");
      }
      return left.localeCompare(right, "en");
    }

    function getSearchMatches() {
      const query = state.search.trim().toLowerCase();
      return data.filter((item) => {
        if (!query) {
          return true;
        }
        const searchSpace = [
          item.target,
          item.productName,
          item.catalogNo,
          item.clone,
          item.vendor
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();
        return searchSpace.includes(query);
      });
    }

    function getFilteredData() {
      return getSearchMatches().filter((item) => {
        const matchesSpecies = !state.species || item.species === state.species;
        const matchesDye = !state.dye || item.dye === state.dye;
        return matchesSpecies && matchesDye;
      });
    }

    function getVisibleOptions(key) {
      const base = getSearchMatches().filter((item) => {
        if (key !== "species" && state.species && item.species !== state.species) {
          return false;
        }
        if (key !== "dye" && state.dye && item.dye !== state.dye) {
          return false;
        }
        return true;
      });

      const unique = Array.from(
        new Set(
          base
            .map((item) => item[key])
            .filter((value) => !isMissing(value))
        )
      ).sort((left, right) => compareOptions(key, left, right));

      if (state[key] && !unique.includes(state[key])) {
        unique.unshift(state[key]);
      }

      return unique;
    }

    function renderFilterGroup(key, container, countNode, options) {
      container.innerHTML = options
        .map((value) => {
          const active = state[key] === value;
          return `
            <button
              type="button"
              class="filter-chip${active ? " is-active" : ""}"
              data-filter-key="${key}"
              data-filter-value="${escapeHtml(value)}"
              aria-pressed="${active ? "true" : "false"}"
            >
              ${escapeHtml(value)}
            </button>
          `;
        })
        .join("");
      countNode.textContent = `${options.length} 项`;
    }

    function renderFilters() {
      const speciesOptions = getVisibleOptions("species");
      const dyeOptions = getVisibleOptions("dye");

      renderFilterGroup("species", speciesFilters, speciesFilterCount, speciesOptions);
      renderFilterGroup("dye", dyeFilters, dyeFilterCount, dyeOptions);

      document.querySelectorAll(".filter-chip").forEach((button) => {
        button.addEventListener("click", () => {
          const key = button.dataset.filterKey;
          const value = button.dataset.filterValue;
          state[key] = state[key] === value ? "" : value;
          render();
        });
      });
    }

    function renderActiveFilters() {
      const chips = [];
      if (state.search) {
        chips.push(`关键词: ${state.search}`);
      }
      if (state.species) {
        chips.push(`${filterLabels.species}: ${state.species}`);
      }
      if (state.dye) {
        chips.push(`${filterLabels.dye}: ${state.dye}`);
      }

      if (chips.length === 0) {
        activeFilters.hidden = true;
        activeFilters.innerHTML = "";
        return;
      }

      activeFilters.hidden = false;
      activeFilters.innerHTML = chips
        .map((item) => `<span class="active-chip">${escapeHtml(item)}</span>`)
        .join("");
    }

    function buildMetaItem(label, value) {
      return `
        <div class="meta-item">
          <dt>${escapeHtml(label)}</dt>
          <dd>${escapeHtml(displayValue(value))}</dd>
        </div>
      `;
    }

    function buildImageSection(item) {
      if (isMissing(item.imagePath)) {
        return `
          <div class="result-image-block is-empty">
            <p class="image-block-title">滴定结果图</p>
            <div class="image-placeholder">暂无滴定结果图</div>
          </div>
        `;
      }

      const previewTitle = `${displayValue(item.target)} · ${displayValue(item.species)} · ${displayValue(item.dye)}`;
      return `
        <div class="result-image-block">
          <p class="image-block-title">滴定结果图</p>
          <button
            type="button"
            class="image-trigger"
            data-image-path="${escapeHtml(item.imagePath)}"
            data-image-title="${escapeHtml(previewTitle)}"
          >
            <img src="${escapeHtml(item.imagePath)}" alt="${escapeHtml(previewTitle)}" loading="lazy" />
          </button>
          <button
            type="button"
            class="image-link"
            data-image-path="${escapeHtml(item.imagePath)}"
            data-image-title="${escapeHtml(previewTitle)}"
          >
            查看滴定结果
          </button>
        </div>
      `;
    }

    function renderResults() {
      const filteredData = getFilteredData();
      resultCount.textContent = String(filteredData.length);
      resultsHeading.textContent = state.search || state.species || state.dye ? "筛选结果" : "全部记录";

      if (filteredData.length === 0) {
        resultsList.innerHTML = "";
        emptyState.hidden = false;
        return;
      }

      emptyState.hidden = true;
      resultsList.innerHTML = filteredData
        .map((item) => {
          const titrationRemark = isMissing(item.titrationResult)
            ? ""
            : `<p class="result-note"><span>滴定结果</span>${escapeHtml(item.titrationResult)}</p>`;

          return `
            <article class="result-card" data-id="${escapeHtml(item.id)}">
              <div class="result-card-accent"></div>
              <div class="result-card-body">
                <div class="result-card-header">
                  <div class="result-card-main">
                    <div class="result-flags">
                      <span class="flag flag-dye">${escapeHtml(item.dye)}</span>
                      <span class="flag">${escapeHtml(item.species)}</span>
                      <span class="flag flag-light">${escapeHtml(item.sample)}</span>
                    </div>
                    <h3>${escapeHtml(item.target)}</h3>
                    <p class="product-name">${escapeHtml(displayValue(item.productName))}</p>
                  </div>
                  <div class="dose-box">
                    <span class="dose-label">最佳用量</span>
                    <strong>${escapeHtml(displayValue(item.optimalDose))}</strong>
                    <span class="dose-sub">最低用量 ${escapeHtml(displayValue(item.minimumDose))}</span>
                  </div>
                </div>

                <div class="result-card-content">
                  <dl class="meta-grid">
                    ${buildMetaItem("货号", item.catalogNo)}
                    ${buildMetaItem("克隆号", item.clone)}
                    ${buildMetaItem("厂家", item.vendor)}
                    ${buildMetaItem("浓度", item.concentration)}
                    ${buildMetaItem("厂家推荐用量", item.vendorDose)}
                    ${buildMetaItem("体系", item.system)}
                    ${buildMetaItem("染色条件", item.stainCondition)}
                  </dl>
                  ${buildImageSection(item)}
                </div>
                ${titrationRemark}
              </div>
            </article>
          `;
        })
        .join("");

      document.querySelectorAll("[data-image-path]").forEach((button) => {
        button.addEventListener("click", () => {
          openImageModal(button.dataset.imagePath, button.dataset.imageTitle);
        });
      });
    }

    function openImageModal(path, title) {
      state.previewOpen = true;
      state.previewImage = path;
      state.previewTitle = title;
      modalImage.src = path;
      modalImage.alt = title;
      imageModalTitle.textContent = title;
      imageModal.hidden = false;
      document.body.classList.add("modal-open");
    }

    function closeModal() {
      state.previewOpen = false;
      state.previewImage = "";
      state.previewTitle = "";
      modalImage.src = "";
      modalImage.alt = "";
      imageModalTitle.textContent = "";
      imageModal.hidden = true;
      document.body.classList.remove("modal-open");
    }

    function resetFilters() {
      state.search = "";
      state.species = "";
      state.dye = "";
      searchInput.value = "";
      render();
    }

    function render() {
      renderFilters();
      renderActiveFilters();
      renderResults();
    }

    searchInput.addEventListener("input", (event) => {
      state.search = event.target.value;
      render();
    });

    clearFiltersButton.addEventListener("click", resetFilters);
    closeImageModal.addEventListener("click", closeModal);
    imageModal.addEventListener("click", (event) => {
      if (event.target.dataset.close === "true") {
        closeModal();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.previewOpen) {
        closeModal();
      }
    });

    render();
  </script>
